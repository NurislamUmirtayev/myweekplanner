<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Week · Lesson Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f2;--bg2:#eef1ff;--bg3:#e6f7f3;--card:rgba(255,255,255,.66);--card2:rgba(255,255,255,.88);--ink:#2a2543;--muted:#7d7898;--line:rgba(90,70,170,.14);--a1:#8b6cff;--a2:#ff7eb6;--a3:#ffb36b;
--c-lesson:#ff7eb6;--c-prep:#6cb8ff;--c-grade:#5fd3a0;--c-other:#ffb36b;--shadow:0 18px 50px -18px rgba(90,60,190,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1530;--bg2:#121830;--bg3:#0f2230;--card:rgba(44,38,80,.58);--card2:rgba(58,50,100,.85);--ink:#f3f0ff;--muted:#a8a2c9;--line:rgba(255,255,255,.1);--shadow:0 18px 50px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a1530;--bg2:#121830;--bg3:#0f2230;--card:rgba(44,38,80,.58);--card2:rgba(58,50,100,.85);--ink:#f3f0ff;--muted:#a8a2c9;--line:rgba(255,255,255,.1);--shadow:0 18px 50px -18px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite alternate}
.b1{width:380px;height:380px;background:var(--a2);top:-120px;left:-100px}
.b2{width:420px;height:420px;background:var(--a1);top:25%;right:-160px;animation-delay:-6s}
.b3{width:340px;height:340px;background:var(--a3);bottom:-140px;left:25%;opacity:.35;animation-delay:-11s}
@keyframes float{to{transform:translate(50px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hello{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:17px;margin:0 0 2px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(36px,7vw,64px);line-height:1;margin:0;letter-spacing:-1.5px;font-weight:700}
h1 span{background:linear-gradient(100deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:8px 0 0;font-weight:800;color:var(--muted);letter-spacing:.06em;font-size:13px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:800;backdrop-filter:blur(12px);transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button:active{transform:scale(.96)}
.primary{background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;border:0;box-shadow:0 10px 24px -8px var(--a1)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.side{order:2;display:flex;flex-direction:column;gap:20px}
@media(max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}.side{order:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.mh b{font-family:Fraunces,Georgia,serif;font-size:21px}
.mh button{padding:4px 12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-bottom:20px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:22px;background:var(--card);border:1px solid var(--line);animation:up .5s both;animation-delay:calc(var(--i)*55ms)}
.chip .w{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip .n{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:700;line-height:1.1}
.chip .dots{display:flex;gap:4px;height:8px;align-items:center}
.chip .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip small{font-size:11px;font-weight:800;color:var(--muted)}
.chip.today{border:2px solid var(--a2)}
.chip.sel{background:linear-gradient(140deg,var(--a1),var(--a2));color:#fff;border-color:transparent;box-shadow:0 14px 28px -10px var(--a1)}
.chip.sel .w,.chip.sel small{color:rgba(255,255,255,.85)}
.chip.sel .dots i{background:#fff}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.agenda{padding:24px}
.ah{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.ah h2{font-family:Fraunces,Georgia,serif;font-size:clamp(24px,4vw,34px);margin:0;line-height:1.1}
.ah p{margin:4px 0 0;color:var(--muted);font-weight:700}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:22px;background:color-mix(in srgb,var(--c) 14%,var(--card2));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);animation:up .4s both;animation-delay:calc(var(--i)*60ms)}
.ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));box-shadow:0 8px 18px -8px var(--c)}
.tx{min-width:0}
.tx b{display:block;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.tx span{color:var(--muted);font-weight:700;font-size:14px;overflow-wrap:anywhere}
.item.done .tx b{text-decoration:line-through;opacity:.5}
.acts{display:flex;gap:6px}
.acts button{width:40px;height:40px;padding:0;font-size:17px;border-radius:50%}
.acts .ok.on{background:linear-gradient(135deg,var(--c-grade),#3fbf8a);color:#fff;border:0}
@media(max-width:420px){.item{grid-template-columns:auto 1fr}.acts{grid-column:1/-1;justify-content:flex-end}}
.empty{text-align:center;padding:36px 10px;color:var(--muted);font-family:Fraunces,Georgia,serif;font-style:italic;font-size:18px}
.empty span{display:block;font-size:42px;font-style:normal;margin-bottom:6px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center}
.mg .dn{font-size:11px;color:var(--muted);font-weight:800;padding-bottom:6px}
.md{aspect-ratio:1;border:0;padding:0;background:transparent;font-size:13px;font-weight:700;position:relative;box-shadow:none;display:flex;align-items:center;justify-content:center;backdrop-filter:none;border-radius:14px}
.md:hover{background:var(--line);transform:none;box-shadow:none}
.md.out{color:var(--muted);opacity:.4}
.md.inweek{background:color-mix(in srgb,var(--a1) 16%,transparent)}
.md.today{outline:2px solid var(--a2)}
.md.sel{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;opacity:1}
.md.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--a3)}
.fm{display:grid;gap:12px}
label{font-size:12px;font-weight:800;color:var(--muted);display:grid;gap:5px;letter-spacing:.04em}
input,select,textarea{font:inherit;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:11px 13px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 22%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(30,20,60,.45);backdrop-filter:blur(8px)}
.ov.show{display:flex}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card2);animation:up .35s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
<header>
 <div><p class="hello" id="hello"></p><h1>My <span>Week</span> ✦</h1><p class="sub" id="range"></p></div>
 <div class="hr">
  <button class="primary" id="now">✦ What to do today</button>
  <div class="nav"><button id="prev" title="Previous week">←</button><button id="today">Today</button><button id="next" title="Next week">→</button><button id="theme" title="Light / dark">◐</button></div>
 </div>
</header>
<div class="layout">
 <main>
  <div class="strip" id="strip"></div>
  <section class="card agenda" id="agenda"></section>
 </main>
 <aside class="side">
  <div class="card"><div class="mh"><button id="mp">‹</button><b id="mt"></b><button id="mn">›</button></div><div class="mg" id="mg"></div></div>
  <div class="card" id="addcard">
   <div class="mh"><b>Add a lesson</b><span>✨</span></div>
   <div id="f" class="fm">
    <label>TITLE<input id="t" required placeholder="e.g. Narrative Tenses"></label>
    <div class="row"><label>DATE<input type="date" id="d" required></label><label>TIME<input type="time" id="tm"></label></div>
    <label>TYPE<select id="c"><option value="lesson">📖 Lesson</option><option value="prep">✏️ Preparation</option><option value="grade">✅ Checking work</option><option value="other">✨ Other</option></select></label>
    <label>NOTES<textarea id="n" rows="2" placeholder="Optional"></textarea></label>
    <button class="primary" id="addbtn" type="button">+ Add to my week</button>
   </div>
  </div>
 </aside>
</div>
</div>
<div class="ov" id="ov"><div class="card sheet" id="sheet"></div></div>
<script>
const K='lessonPlanner.v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icons={lesson:'📖',prep:'✏️',grade:'✅',other:'✨'};
const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const full=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const mnames=['January','February','March','April','May','June','July','August','September','October','November','December'];
let items=[],seeded=false;
try{const r=localStorage.getItem(K);seeded=!!r;items=JSON.parse(r||'null')||[]}catch(e){items=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}};
let sel=fmt(new Date()),mon=new Date(parse(sel).getFullYear(),parse(sel).getMonth(),1);
if(!seeded){const m=monday(new Date());const mk=(o,t,tm,c)=>({id:Math.random().toString(36).slice(2),title:t,date:fmt(addDays(m,o)),time:tm,cat:c,note:'',done:false});
items=[mk(0,'Narrative Tenses','10:00','lesson'),mk(1,'Prepare vocabulary cards','16:00','prep'),mk(2,'Speaking club','18:00','lesson'),mk(4,'Check homework','14:00','grade')];save()}
const on=s=>items.filter(x=>x.date===s).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
function render(){
 const sd=parse(sel),wk=monday(sd),end=addDays(wk,6),td=fmt(new Date()),h=new Date().getHours();
 $('hello').textContent=h<12?'Good morning ☀︎':h<18?'Good afternoon ☁︎':'Good evening ☾';
 $('range').textContent=(mnames[wk.getMonth()].slice(0,3)+' '+wk.getDate()+' – '+(wk.getMonth()!==end.getMonth()?mnames[end.getMonth()].slice(0,3)+' ':'')+end.getDate()+', '+end.getFullYear()).toUpperCase();
 $('strip').innerHTML=names.map((nm,i)=>{const d=addDays(wk,i),s=fmt(d),l=on(s);
  return `<button class="chip ${s===td?'today':''} ${s===sel?'sel':''}" style="--i:${i}" data-sel="${s}"><span class="w">${nm}</span><span class="n">${d.getDate()}</span><span class="dots">${l.slice(0,4).map(x=>`<i style="--c:var(--c-${x.cat})"></i>`).join('')}</span><small>${l.length?l.length+(l.length>1?' tasks':' task'):'free'}</small></button>`}).join('');
 const l=on(sel),dn=l.filter(x=>x.done).length;
 $('agenda').innerHTML=`<div class="ah"><div><h2>${sel===td?'Today · ':''}${full[(sd.getDay()+6)%7]}, ${sd.getDate()} ${mnames[sd.getMonth()]}</h2><p>${l.length?(l.length===dn?'All done — well done! 🎉':dn+' of '+l.length+' done'):'Nothing planned yet'}</p></div><button class="primary" data-add="1">+ Add</button></div>`+
 (l.length?`<div class="list">`+l.map((x,i)=>`<div class="item ${x.done?'done':''}" style="--c:var(--c-${x.cat});--i:${i}"><div class="ic">${icons[x.cat]}</div><div class="tx"><b>${esc(x.title)}</b><span>${x.time||'Any time'}${x.note?' · '+esc(x.note):''}</span></div><div class="acts"><button class="ok ${x.done?'on':''}" data-done="${x.id}" title="Done">✓</button><button data-del="${x.id}" title="Delete">×</button></div></div>`).join('')+`</div>`:`<div class="empty"><span>🌸</span>A free day — enjoy it!</div>`);
 $('mt').textContent=mnames[mon.getMonth()]+' '+mon.getFullYear();
 let g=names.map(n=>`<div class="dn">${n[0]}</div>`).join('');
 const st=monday(mon);
 for(let i=0;i<42;i++){const d=addDays(st,i),s=fmt(d);
  g+=`<button class="md ${d.getMonth()!==mon.getMonth()?'out':''} ${d>=wk&&d<=end?'inweek':''} ${s===td?'today':''} ${s===sel?'sel':''} ${on(s).length?'has':''}" data-day="${s}">${d.getDate()}</button>`}
 $('mg').innerHTML=g;
 if($('ov').classList.contains('show'))sheet();
}
const go=s=>{sel=s;const d=parse(s);mon=new Date(d.getFullYear(),d.getMonth(),1);$('d').value=s;render()};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sel||b.dataset.day){go(b.dataset.sel||b.dataset.day);if(b.dataset.sel)$('agenda').scrollIntoView({behavior:'smooth',block:'nearest'})}
 else if(b.dataset.add){$('d').value=sel;$('addcard').scrollIntoView({behavior:'smooth',block:'center'});$('t').focus({preventScroll:true})}
 else if(b.dataset.close){$('ov').classList.remove('show')}
 else if(b.dataset.del){items=items.filter(x=>x.id!==b.dataset.del);save();render()}
 else if(b.dataset.done){const x=items.find(x=>x.id===b.dataset.done);x.done=!x.done;save();render()}});
function sheet(){const d=new Date(),l=on(fmt(d)),dn=l.filter(x=>x.done).length;
 $('sheet').innerHTML=`<div class="ah"><div><h2>Today’s plan</h2><p>${full[(d.getDay()+6)%7]}, ${d.getDate()} ${mnames[d.getMonth()]} · ${l.length?dn+' of '+l.length+' done':'nothing planned'}</p></div><button data-close="1">Close ✕</button></div>`+(l.length?`<div class="list">`+l.map((x,i)=>`<div class="item ${x.done?'done':''}" style="--c:var(--c-${x.cat});--i:${i}"><div class="ic">${icons[x.cat]}</div><div class="tx"><b>${esc(x.title)}</b><span>${x.time||'Any time'}${x.note?' · '+esc(x.note):''}</span></div><div class="acts"><button class="ok ${x.done?'on':''}" data-done="${x.id}" title="Done">✓</button><button data-del="${x.id}" title="Delete">×</button></div></div>`).join('')+`</div>`:`<div class="empty"><span>🌸</span>A free day — enjoy it!</div>`)}
$('now').onclick=()=>{go(fmt(new Date()));sheet();$('ov').classList.add('show')};
$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov').classList.remove('show')});
$('today').onclick=()=>go(fmt(new Date()));
$('prev').onclick=()=>go(fmt(addDays(parse(sel),-7)));
$('next').onclick=()=>go(fmt(addDays(parse(sel),7)));
$('mp').onclick=()=>{mon=new Date(mon.getFullYear(),mon.getMonth()-1,1);render()};
$('mn').onclick=()=>{mon=new Date(mon.getFullYear(),mon.getMonth()+1,1);render()};
let dark=false;
try{const sv=localStorage.getItem('lessonPlanner.theme');dark=sv?sv==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}
const applyTheme=()=>{document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'☀︎':'☾';try{localStorage.setItem('lessonPlanner.theme',dark?'dark':'light')}catch(e){}};
$('theme').onclick=()=>{dark=!dark;applyTheme()};
applyTheme();
$('addbtn').onclick=()=>{if(!$('t').value.trim()||!$('d').value){($('t').value.trim()?$('d'):$('t')).focus();return}
 items.push({id:Math.random().toString(36).slice(2),title:$('t').value.trim(),date:$('d').value,time:$('tm').value,cat:$('c').value,note:$('n').value.trim(),done:false});
 save();$('t').value='';$('n').value='';go($('d').value);$('agenda').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('d').value=sel;
$('t').addEventListener('keydown',e=>{if(e.key==='Enter')$('addbtn').click()});
render();
</script>
</body>
</html>
